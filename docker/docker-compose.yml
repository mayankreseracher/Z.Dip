version: '3.8'

services:
  zdip:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zdip-sovereign-engine
    restart: unless-stopped
    ports:
      - "8088:8088" # Z.Dip OLED Web Dashboard
    volumes:
      - ../downloads:/app/downloads
      - ../config:/app/config
    environment:
      - ZDIP_HOST=0.0.0.0
      - ZDIP_PORT=8088
      - TOR_HOST=127.0.0.1
      - TOR_SOCKS_PORT=9050
